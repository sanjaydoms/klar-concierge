# Dependabot: proposes dependency upgrades as PRs, including the breaking
# ones the automated `npm audit fix` deliberately never applies. Security
# updates are raised as soon as advisories publish.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
