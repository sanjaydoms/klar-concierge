# Autonomous knowledge maintenance — no human in the loop.
#
# Weekly (and on demand): enrich every destination with freshly measured
# climate + citations, regenerate anything past its review date via the
# evidence-grounded AI pipeline, validate, run the full test gate, and commit
# straight to main. Vercel redeploys automatically.
#
# Safety comes from machines, not reviewers: measured data overrides AI
# opinion, an adversarial audit pass must approve every regeneration, schema
# validation gates the build, and the eval suite must stay green before any
# commit is pushed.
#
# Repository secrets used (either AI key is enough; enrichment needs none):
#   ANTHROPIC_API_KEY  — preferred engine (Claude)
#   OPENAI_API_KEY     — fallback engine
name: knowledge-autonomous

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: knowledge-autonomous
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Enrich all destinations with measured climate + citations
        run: npm run knowledge:enrich

      - name: Fetch destination photography (Wikimedia, with credits)
        run: npm run knowledge:images
        continue-on-error: true # a missing photo never blocks fresh knowledge

      - name: Regenerate destinations past their review date (AI, evidence-grounded)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run knowledge:autonomous -- --refresh-stale
        continue-on-error: true # a failed regen keeps the enriched data flowing

      - name: Validate and compile knowledge
        run: npm run knowledge:build

      - name: Full quality gate before anything ships
        run: |
          npm run typecheck
          npm test
          npm run eval:critical

      - name: Commit refreshed knowledge to main
        run: |
          git config user.name "klar-knowledge-bot"
          git config user.email "knowledge-bot@users.noreply.github.com"
          git add knowledge/ src/generated-knowledge/ public/destinations/
          if git diff --cached --quiet; then
            echo "Knowledge already fresh — nothing to commit."
          else
            git commit -m "Autonomous knowledge refresh: measured climate, citations, stale regenerations"
            git push
          fi
